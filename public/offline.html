<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>Offline - SaaS Workshop</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, 0.24), transparent 28%),
                radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.14), transparent 24%),
                linear-gradient(180deg, #020617 0%, #0f172a 100%);
            color: #e2e8f0;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .card {
            width: min(100%, 480px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            box-shadow: 0 30px 60px rgba(2, 6, 23, 0.35);
            padding: 28px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border-radius: 999px;
            padding: 10px 14px;
            background: rgba(34, 211, 238, 0.12);
            color: #a5f3fc;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.24em;
        }
        h1 {
            margin: 18px 0 12px;
            font-size: clamp(32px, 8vw, 44px);
            line-height: 1.05;
            color: #fff;
        }
        p {
            margin: 0;
            line-height: 1.7;
            color: #cbd5e1;
        }
        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 24px;
        }
        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 18px;
            border-radius: 18px;
            text-decoration: none;
            font-weight: 700;
        }
        .primary { background: #22d3ee; color: #082f49; }
        .secondary { border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; background: rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body>
    <main class="card">
        <div class="badge">Offline mode</div>
        <h1>You are offline.</h1>
        <p>The app shell is still available from cache. Reconnect to sync the latest lead, project, and team data.</p>
        <div class="actions">
            <a class="primary" href="/">Retry</a>
            <a class="secondary" href="/dashboard">Go to dashboard</a>
        </div>
    </main>
    <script>
        window.addEventListener('online', function () {
            window.location.reload();
        });
    </script>
</body>
</html>
